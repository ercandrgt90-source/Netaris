# Cloudflare dagitim yapilandirmasi
#
# Bu dosya sayesinde yayina alma tek komuta iniyor:
#     python yayinla.py
#
# Elle ZIP yukleme dongusu bitiyor. Ayrica proje adi da duzeliyor --
# panelde rastgele "raspy-dream-edeb" yerine "netaris" gorunecek.

name = "netaris"
compatibility_date = "2026-07-31"

# Uyelik API'si. Cloudflare ONCE statik varlia bakar; `/giris/` ve
# `/panel/` gercek dosya oldugu icin Worker'a hic gelmez. Worker yalnizca
# `/api/...` icin calisiyor.
#
# Bunun onemi: sitenin OKUMA tarafi eskisi gibi tamamen statik. Uyelik
# sistemi ya da veritabani coktugunde haberler ve analizler yayinda kalir.
main = "./worker.js"

# KENDI ALAN ADI -- BAGLANINCA ACILACAK.
#
# NEDEN GEREKLI, "guzel gorunsun" DEGIL: `*.workers.dev` Turk
# Telekom'un "Guvenli Internet" suzgeci tarafindan engelleniyor.
# Olculdu (2026-08-11): DNS cozuluyor, TCP 443 aciliyor, ama TLS el
# sikismasi kesiliyor ve 443 portundan su donuyor --
#
#     HTTP/1.1 307 Temporary Redirect
#     Via: 1.0 middlebox
#     Location: https://guvenliinternet.turktelekom.com.tr/?...
#
# Ust alan adi `workers.dev` de ayni sekilde engelli, yani bu bir
# KATEGORI engeli; icerigimizle ilgisi yok ve bizim tarafimizdan
# duzeltilemez. Turk okura yayin yapan bir sitenin adresi Turkiye'de
# engelli olamaz.
#
# ALAN ADI ALINDIGINDA, SIRASIYLA:
#   1. Alan adi Cloudflare hesabina eklenir (bolge/zone olusur).
#   2. Asagidaki iki satirin basindaki `#` kaldirilir.
#   3. `NETARIS_ADRES=https://netaris.net python site/insa.py` ile
#      kanonik adres, sitemap, robots ve RSS yeniden uretilir
#      (bkz. `site/insa.py` -> `TABAN_ADRES`).
#   4. `npx wrangler deploy`
#
# 3. ADIM ATLANIRSA site kendini hala eski adresle ilan eder ve iki
# adres birbirinin kopyasi olur. `denetim.py` bunu yakalamaz -- eski
# adres COZUMLENIYOR, yalnizca yanlis.
#
routes = [
  { pattern = "netaris.net", custom_domain = true },
]

# NOBETCI -- GitHub takvimi durdugunda akisi geri getiren yedek tetik.
#
# 2026-08-26 aksami Actions kotasi doldu ve zamanlanmis kosular durdu.
# Kota bitince is KIRMIZI DONMUYOR, sadece BASLAMIYOR -- yani uyari
# hicbir yerde gorunmuyor. Depo ertesi gun herkese acildi (dakika
# sinirsiz) ama takvim geri gelmedi; site saatlerce bayat kaldi.
#
# Saat basi calisiyor ama HER SAAT TETIKLEMIYOR: once yayindaki en yeni
# icerigin yasina bakiyor ve yalnizca iki saatten eskiyse GitHub'a
# `repository_dispatch` gonderiyor (bkz. worker.js -> nobetci).
# GitHub'in kendi takvimi calisirken bu kod sessiz duruyor.
#
# `GITHUB_TETIK_JETONU` tanimli degilse hicbir sey yapmiyor:
#     npx wrangler secret put GITHUB_TETIK_JETONU
# Ince taneli PAT, yalnizca bu depoda `contents: write`.
[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./cikti"
binding = "ASSETS"

# Bulunamayan adreste 404 dondur. "single-page-application" secilirse her
# adres index.html'e yonlenir ve kirik baglantilar sessizce ana sayfayi
# gosterir -- haber sitesinde istenmeyen davranis.
not_found_handling = "none"

# Uyelik veritabani. `database_id` `wrangler d1 create netaris-uyelik`
# komutunun ciktisindan geliyor; gizli bir deger degil, hesaba ozgu bir
# kimlik.
[[d1_databases]]
binding = "DB"
database_name = "netaris-uyelik"
database_id = "56f6ce02-a748-4c58-b378-46c46e02a21a"

# GOOGLE ILE GIRIS.
#
# Bu deger GIZLI DEGIL: istemci kimligi sayfada zaten gorunuyor ve
# oyle olmasi gerekiyor. ISTEMCI SIRRI KULLANILMIYOR -- kimlik jetonu
# (ID token) akisi sirr istemiyor, dolayisiyla saklanacak, donecek,
# sizabilecek bir sey yok. Sunucu jetonun imzasini Google'in acik
# anahtariyla dogruluyor ve `aud` alaninin BU kimlige esit oldugunu
# kontrol ediyor (bkz. worker.js -> jetonDogrula, site/test_google.js).
#
# BOS BIRAKILIRSA ozellik tumuyle KAPALI: `/api/giris/google/ayar` bos
# doner, sayfa Google betigini hic yuklemez, dugme hic basilmaz.
# Yani yapilandirilmadan once ucuncu tarafa tek bir istek gitmiyor.
#
# NASIL ALINIR
#   1. console.cloud.google.com -> proje sec ya da olustur
#   2. "APIs & Services" -> "Credentials" -> "Create Credentials"
#      -> "OAuth client ID" -> tur: "Web application"
#   3. "Authorized JavaScript origins" alanina sitenin adresi yazilir
#      (su an https://netaris.ercandrgt90.workers.dev; kendi alan adi
#      baglanınca O DA eklenmeli -- eksik origin, dugmenin sessizce
#      calismamasi demektir)
#   4. Cikan "Client ID" asagiya yazilir
#
# VERITABANI: `uye` tablosuna `google_id` sutunu gerekiyor.
#   npx wrangler d1 execute netaris-uyelik --remote --file=./d1/gocler.sql
#
# GOOGLE ILE GIRIS.
#
# Bu deger GIZLI DEGIL: istemci kimligi tarayiciya zaten gonderiliyor
# ve Google'in kendi belgeleri de herkese acik oldugunu soyluyor.
# O yuzden `wrangler secret` degil `[vars]` -- depoda durmasi dogru.
#
# Istemci SIRRI ise burada YOK ve olmamali: bizim akis kimlik jetonu
# dogrulamasi yapiyor, sir gerektiren yetkilendirme akisi degil.
#
# Alan adi baglandiginda Google Cloud > Clients > netaris-web icindeki
# "Authorised JavaScript origins" listesine `https://netaris.net`
# de EKLENMELI -- yoksa asil adreste giris calismaz.
[vars]
GOOGLE_ISTEMCI_KIMLIGI = "127066136453-fl67t9o3f2v6hqas0d10v3kob9nvlq10.apps.googleusercontent.com"

# GIZLI DEGERLER buraya YAZILMAZ. `wrangler secret put` ile konur:
#   RESEND_API_KEY  e-posta dogrulamasi icin (yoksa yonetici onayina duser)
#   HAT_SIRRI       yayin hattinin onaylanmis yazilari cektigi ucun sirri
#   POSTA_GONDEREN  "Netaris <bildirim@alanadiniz.com>"
