# Netaris kesintisiz otomasyon
#
# Makine kapali olsa da calisir: veriyi toplar, icerigi uretir, siteyi
# kurar, Cloudflare'e dagitir ve dogrular.
#
# NEDEN HER SAAT DEGIL DE BOYLE
# -----------------------------
# Depo OZEL. Ozel depoda GitHub Actions ayda 2.000 dakika veriyor; bir
# calisma ~3 dakika. Kesintisiz "her saat" (720 calisma) ayda 2.160 dakika
# eder ve kotayi ayin son gunlerinde bitirir -- yani en cok ihtiyac
# duyulan anda otomasyon durur.
#
# Onun yerine akisin gercek ritmine uyduruldu:
#   Hafta ici 05-20 UTC (08-23 TRT) saat basi  -> 16 x 22 gun = 352
#   Hafta sonu dort saatte bir                 ->  6 x  8 gun =  48
#   Toplam ~400 calisma ~ 1.200 dakika. Kota icinde, payi da var.
#
# Turkiye'de ekonomi haberi hafta ici mesai saatlerinde akiyor; ABD ve AB
# duyurulari 15-23 TRT arasinda cikiyor. Gece 00-05 TRT'de yeni haber
# neredeyse yok, o saatlerde calismak bosa dakika harcamak olurdu.
#
# Depo herkese acik yapilirsa Actions dakikasi SINIRSIZ olur ve bu
# takvim serbestce sikilastirilabilir.
#
# GEREKEN GIZLI DEGERLER (GitHub > Settings > Secrets and variables >
# Actions > New repository secret):
#
#   CLOUDFLARE_API_TOKEN   Cloudflare panelinden uretilen dagitim jetonu
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare hesap kimligi
#
# Bu iki deger DOSYAYA YAZILMAZ. GitHub sifreli saklar, kayitlarda
# maskeler ve depoyu klonlayan kimse goremez.

name: Netaris otomasyon

on:
  schedule:
    # Saatler UTC, Turkiye UTC+3.
    # Hafta ici YARIM SAATTE BIR: 05-20 UTC = 08:00-23:00 TRT
    #
    # Saat basiydi. Olculdu: FinancialJuice tek cagrida 100 baslik
    # veriyor ve yogun saatlerde bu, bir saatten KISA bir pencereye
    # karsilik geliyor -- yani iki calistirma arasindaki gelismelerin
    # bir kismi hic gorulmuyordu. Kaynak "son 100"den fazlasini
    # vermiyor, o yuzden cozum daha sik bakmak.
    - cron: "*/30 5-20 * * 1-5"
    # Hafta sonu dort saatte bir: 03:00-23:00 TRT
    - cron: "0 0,4,8,12,16,20 * * 0,6"
  # Panelden elle de calistirilabilsin
  workflow_dispatch:
    inputs:
      yayinla:
        description: "Cloudflare'e dağıt"
        type: boolean
        default: true

# Ayni anda iki calisma olmasin: ikisi de depoya yazip birbirini ezerdi.
#
# Grup adi `bilanco.yml` ile ORTAK. Iki AYRI is akisi ama ayni depoya
# yaziyorlar; grup adlari farkli olsaydi es zamanli kosup birbirinin
# commitini ezebilirlerdi -- ayirmanin amaci zamanlamayi ayirmakti,
# yazmayi degil.
concurrency:
  group: netaris-depo-yazma
  cancel-in-progress: false

# EYLEM SURUMLERI.
#
# GitHub, Node 20 hedefleyen eylemleri Node 24'e zorluyor ve her
# calistirmada uyari basiyor. Uyari calismayi engellemiyor ama
# gunlugu kirletiyor ve gercek bir sorun ciktiginda gozden kaciriyor.
# Surumler Node 24 hedefleyen surumlere yukseltildi.
jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      # Biriken veriyi (depo, onbellek, uretilen icerik) geri commit etmek
      # icin yazma yetkisi gerekiyor
      contents: write

    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Node kur
        # wrangler icin gerekiyor
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Testleri çalıştır
        # Bozuk kodla yayina cikmamak icin. Test kalirsa is durur ve
        # site eski haliyle ayakta kalir -- bozuk icerik yayimlanmaz.
        #
        # TESTLER BULUNARAK CALISTIRILIYOR, ELLE SAYILARAK DEGIL.
        #
        # Once yedi dosya tek tek yaziliydi ve liste sessizce eskidi:
        # depoda on test varken CI yedisini calistiriyordu. Calismayan
        # ucu test_onem (haber siralamasinin tamami), test_besleme
        # (kaynak suzgecleri) ve test_gundem_yorum (hangi haber sayfa
        # alir) idi -- yani en yeni ve en kritik uc modulun testi.
        #
        # Elle tutulan liste, her yeni testte unutulmak uzere kurulmus
        # demektir. Artik yeni test dosyasi eklemek yeterli.
        # PYTHON VE JAVASCRIPT, IKISI DE.
        #
        # Yalnizca `test_*.py` araniyordu. Tarayicida calisan kodun
        # testi eklendiginde (fiyat seridinin akmasi) CI onu SESSIZCE
        # atlardi -- yukarida "elle tutulan liste eskiyor" diye yazip
        # ayni tuzaga desen duzeyinde yeniden dusmek olurdu.
        run: |
          set -e
          bulunan=0
          for t in $(find haber_botu site -name "test_*.py" | sort); do
            echo "--- $t"
            python "$t"
            bulunan=$((bulunan + 1))
          done
          for t in $(find haber_botu site -name "test_*.js" | sort); do
            echo "--- $t"
            node "$t"
            bulunan=$((bulunan + 1))
          done
          echo "$bulunan test dosyasi calisti"
          # Hic test bulunamadiysa bu bir basari degil, bir arizadir:
          # `find` yolu bozulursa adim sessizce yesil doner ve butun
          # koruma kaybolur.
          if [ "$bulunan" -lt 8 ]; then
            echo "HATA: beklenenden az test bulundu ($bulunan)"
            exit 1
          fi

      - name: Veri topla ve içerik üret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Onaylanmis uye yazilarini panelden cekmek icin. Tanimli
          # degilse o adim kendini atlar, hat kirmizi DONMEZ -- uyelik
          # kapaliyken de site uretilebilmeli.
          HAT_SIRRI: ${{ secrets.HAT_SIRRI }}
          # TCMB EVDS -- Turkiye makro serileri. Tanimli degilse o adim
          # kendini atlar, hat kirmizi DONMEZ.
          EVDS_ANAHTARI: ${{ secrets.EVDS_ANAHTARI }}
          # AI yorumu. Tanimliysa Anthropic, degilse yukaridaki
          # CLOUDFLARE_* ile Workers AI kullaniliyor; ikisi de yoksa
          # adim kendini atlar.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # BILANCO HATTI BURADA KOSMUYOR -- kendi is akisinda
        # (`bilanco.yml`). Sebebi olculdu: 2026-08-20'de bu is
        # 24dk 55sn'de 25 dakikalik tavana carpip KESILDI ve hicbir
        # sey dagitilmadi.
        #
        # Bilanco hatti 324 sirket x 3 tablo = 972 istek atiyor, ustune
        # 60 model cagrisi biniyor. Haber hatti ise yarim saatte bir
        # kosmali. Ikisini ayni 25 dakikaya sikistirmak, SIK kosan
        # hatti NADIR kosan yuzunden riske atmak demekti -- bilanco
        # yilda dort kez bildiriliyor, haber gun boyu akiyor.
        run: |
          python calistir.py --atla bilanco bilanco_sayfa \
            ${{ (github.event_name == 'schedule' || inputs.yayinla) && '--yayinla' || '' }}

      - name: Depo özeti
        if: always()
        run: python haber_botu/beyin.py

      - name: Biriken veriyi geri yaz
        # Beynin gecmisi, ceviri onbellegi, indirilen fotograflar ve
        # uretilen icerik depoya geri yazilir. Boylece bir sonraki
        # calistirma kaldigi yerden devam eder -- ceviri kotasi bastan
        # harcanmaz, fotograflar yeniden indirilmez.
        if: always()
        run: |
          git config user.name  "netaris-bot"
          git config user.email "actions@users.noreply.github.com"

          # Var olan yollari topla. Bir dosya henuz uretilmemisse
          # `git add` hata verip isi dusururdu -- bu yuzden once
          # varligi kontrol ediliyor.
          YOLLAR=""
          for y in haber_botu/netaris.db \
                   haber_botu/kaynak/ceviri_onbellek.json \
                   haber_botu/kaynak/foto_kayit.json \
                   site/statik/foto \
                   site/icerik; do
            [ -e "$y" ] && YOLLAR="$YOLLAR $y"
          done

          if [ -z "$YOLLAR" ]; then
            echo "yazilacak veri yok"
            exit 0
          fi

          # REBASE KULLANILMIYOR -- bilincli.
          #
          # netaris.db ikili bir dosya ve her calistirmada degisiyor.
          # `git pull --rebase` onu birlestirmeye calisip cakisiyordu:
          #     CONFLICT (content): Merge conflict in haber_botu/netaris.db
          #     fatal: You are not currently on a branch.
          # Git ikili dosyayi birlestiremez; boyle bir cakismanin dogru
          # cozumu de yok zaten.
          #
          # Onun yerine: uzak ucun uzerine kendi VERIMIZI koyuyoruz.
          #
          # `--soft` DEGIL `--mixed` (varsayilan) ve sebebi olculdu.
          #
          # `reset --soft` yalnizca HEAD'i tasiyor, INDEKSE dokunmuyor.
          # Indeks ise kosunun BASINDAKI agaci tutuyor. Sonraki
          # `git commit` de `$YOLLAR`i degil INDEKSIN TAMAMINI isliyor.
          # Sonuc: kosu SURERKEN depoya gonderilen her kaynak dosya,
          # botun commitinde sessizce GERI ALINIYOR.
          #
          # 2026-08-20'de olculdu -- bot commiti c285d0c benim
          # ea86ffc'min uzerine kuruldu ve iceriginden bir testi
          # tamamen sildi, bir modulu eski haline dondurdu:
          #     test_bilanco_atlama.py | 102 -------------------
          #     uret_bilanco_sayfa.py  |  50 +----------
          # Hicbir hata verilmedi; kosu YESIL bitti.
          #
          # `--mixed` indeksi de uzak uca esitliyor. Boylece sonraki
          # `git add` YALNIZCA veri yollarini asamaya alir ve commit
          # yalnizca onlari icerir. Calisma dizini yine korunuyor.
          git fetch origin "${GITHUB_REF_NAME}"
          git reset "origin/${GITHUB_REF_NAME}"

          # `-A` DEGIL `--ignore-removal` ve sebebi olculdu.
          #
          # `git add -A` SILMELERI de asamaya aliyor. Kosucunun
          # calisma dizini checkout anindaki agaci tutuyor; o sirada
          # DIGER is akisi yeni dosya uretip gonderdiyse, bu dosyalar
          # origin'de VAR ama burada YOK -- ve `-A` bunu "silinmis"
          # sayip isliyor.
          #
          # 2026-08-20'de tam bu oldu: bilanco hatti 20:11'de 60
          # bilanco sayfasi uretti, ana otomasyon 20:20'de HEPSINI
          # sildi. Iki kosu ES ZAMANLI DEGILDI -- es zamanlilik grubu
          # calisti; sorun ZAMANLAMA degil, `-A`nin anlami.
          #
          # `--ignore-removal` yalnizca yeni ve degismis dosyalari
          # asamaya aliyor. Bu hattin URETTIGI dosyalar yaziliyor,
          # baskasinin urettikleri KORUNUYOR.
          #
          # Gercek silmeler (foto ayiklama gibi) elle islenmeli;
          # otomatik silme yetkisi, otomatik veri kaybi demek.
          git add --ignore-removal $YOLLAR

          # KAPI: veri disinda bir sey asamaya girmis mi?
          #
          # Yukaridaki `--mixed` bunu zaten engelliyor, ama bu kontrol
          # yontemden BAGIMSIZ olarak sonucu dogruluyor. Kaynak kodu
          # sessizce geri alan bir commit bir daha uretilmemeli; bu
          # yuzden kapi kapanirsa is KIRMIZI donuyor.
          KACAK=$(git diff --staged --name-only | grep -vE \
            '^(haber_botu/netaris\.db|haber_botu/kaynak/(ceviri_onbellek|foto_kayit)\.json|site/statik/foto/|site/icerik/)' \
            || true)
          if [ -n "$KACAK" ]; then
            echo "HATA: veri disi dosya asamada -- geri yazma DURDURULDU:"
            echo "$KACAK"
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "degisiklik yok"
          else
            git commit -m "otomatik: veri güncellemesi $(date -u +'%Y-%m-%d %H:%M UTC')"
            # PUSH YENIDEN DENENIYOR.
            #
            # Iki is akisi artik AYRI es zamanlilik gruplarinda ve ayni
            # anda kosabiliyorlar. Ikisi de depoya yaziyor; ikincisinin
            # push'u "non-fast-forward" ile reddedilir.
            #
            # Dogru davranis ZORLAMAK DEGIL yeniden denemek: uzak uc
            # yeniden alinir, kendi yollarimiz tekrar asamaya konur ve
            # commit yenilenir. Zorlamak, digerinin ciktisini silmek
            # olurdu -- bugun tam bunu yasadik (60 bilanco sayfasi).
            for deneme in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "gonderildi (deneme $deneme)"
                break
              fi
              echo "push reddedildi, uzak uc yeniden aliniyor ($deneme)"
              git fetch origin "${GITHUB_REF_NAME}"
              git reset "origin/${GITHUB_REF_NAME}"
              git add --ignore-removal $YOLLAR
              git diff --staged --quiet && { echo "eklenecek yeni sey yok"; break; }
              git commit -m "otomatik: veri güncellemesi $(date -u +'%Y-%m-%d %H:%M UTC')"
              sleep 3
            done
          fi
