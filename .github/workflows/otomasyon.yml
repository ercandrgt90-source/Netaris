# Netaris kesintisiz otomasyon
#
# Makine kapali olsa da calisir: veriyi toplar, icerigi uretir, siteyi
# kurar, Cloudflare'e dagitir ve dogrular.
#
# NEDEN HER SAAT DEGIL DE BOYLE
# -----------------------------
# Depo OZEL. Ozel depoda GitHub Actions ayda 2.000 dakika veriyor; bir
# calisma ~3 dakika. Kesintisiz "her saat" (720 calisma) ayda 2.160 dakika
# eder ve kotayi ayin son gunlerinde bitirir -- yani en cok ihtiyac
# duyulan anda otomasyon durur.
#
# Onun yerine akisin gercek ritmine uyduruldu:
#   Hafta ici 05-20 UTC (08-23 TRT) saat basi  -> 16 x 22 gun = 352
#   Hafta sonu dort saatte bir                 ->  6 x  8 gun =  48
#   Toplam ~400 calisma ~ 1.200 dakika. Kota icinde, payi da var.
#
# Turkiye'de ekonomi haberi hafta ici mesai saatlerinde akiyor; ABD ve AB
# duyurulari 15-23 TRT arasinda cikiyor. Gece 00-05 TRT'de yeni haber
# neredeyse yok, o saatlerde calismak bosa dakika harcamak olurdu.
#
# Depo herkese acik yapilirsa Actions dakikasi SINIRSIZ olur ve bu
# takvim serbestce sikilastirilabilir.
#
# GEREKEN GIZLI DEGERLER (GitHub > Settings > Secrets and variables >
# Actions > New repository secret):
#
#   CLOUDFLARE_API_TOKEN   Cloudflare panelinden uretilen dagitim jetonu
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare hesap kimligi
#
# Bu iki deger DOSYAYA YAZILMAZ. GitHub sifreli saklar, kayitlarda
# maskeler ve depoyu klonlayan kimse goremez.

name: Netaris otomasyon

on:
  schedule:
    # Saatler UTC, Turkiye UTC+3.
    # Hafta ici saat basi: 05-20 UTC = 08:00-23:00 TRT
    - cron: "0 5-20 * * 1-5"
    # Hafta sonu dort saatte bir: 03:00-23:00 TRT
    - cron: "0 0,4,8,12,16,20 * * 0,6"
  # Panelden elle de calistirilabilsin
  workflow_dispatch:
    inputs:
      yayinla:
        description: "Cloudflare'e dağıt"
        type: boolean
        default: true

# Ayni anda iki calisma olmasin: ikisi de depoya yazip birbirini ezerdi
concurrency:
  group: netaris-otomasyon
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      # Biriken veriyi (depo, onbellek, uretilen icerik) geri commit etmek
      # icin yazma yetkisi gerekiyor
      contents: write

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Node kur
        # wrangler icin gerekiyor
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testleri çalıştır
        # Bozuk kodla yayina cikmamak icin. Test kalirsa is durur ve
        # site eski haliyle ayakta kalir -- bozuk icerik yayimlanmaz.
        run: |
          set -e
          python haber_botu/analiz/test_bicim.py
          python haber_botu/analiz/test_skor.py
          python haber_botu/analiz/test_araci_kurum.py
          python haber_botu/analiz/test_varlik.py
          python haber_botu/test_yapistir.py
          python haber_botu/ai/test_guvenlik.py

      - name: Veri topla ve içerik üret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Onaylanmis uye yazilarini panelden cekmek icin. Tanimli
          # degilse o adim kendini atlar, hat kirmizi DONMEZ -- uyelik
          # kapaliyken de site uretilebilmeli.
          HAT_SIRRI: ${{ secrets.HAT_SIRRI }}
          # TCMB EVDS -- Turkiye makro serileri. Tanimli degilse o adim
          # kendini atlar, hat kirmizi DONMEZ.
          EVDS_ANAHTARI: ${{ secrets.EVDS_ANAHTARI }}
        run: |
          python calistir.py ${{ (github.event_name == 'schedule' || inputs.yayinla) && '--yayinla' || '' }}

      - name: Depo özeti
        if: always()
        run: python haber_botu/beyin.py

      - name: Biriken veriyi geri yaz
        # Beynin gecmisi, ceviri onbellegi, indirilen fotograflar ve
        # uretilen icerik depoya geri yazilir. Boylece bir sonraki
        # calistirma kaldigi yerden devam eder -- ceviri kotasi bastan
        # harcanmaz, fotograflar yeniden indirilmez.
        if: always()
        run: |
          git config user.name  "netaris-bot"
          git config user.email "actions@users.noreply.github.com"

          # Var olan yollari topla. Bir dosya henuz uretilmemisse
          # `git add` hata verip isi dusururdu -- bu yuzden once
          # varligi kontrol ediliyor.
          YOLLAR=""
          for y in haber_botu/netaris.db \
                   haber_botu/kaynak/ceviri_onbellek.json \
                   haber_botu/kaynak/foto_kayit.json \
                   site/statik/foto \
                   site/icerik; do
            [ -e "$y" ] && YOLLAR="$YOLLAR $y"
          done

          if [ -z "$YOLLAR" ]; then
            echo "yazilacak veri yok"
            exit 0
          fi

          # REBASE KULLANILMIYOR -- bilincli.
          #
          # netaris.db ikili bir dosya ve her calistirmada degisiyor.
          # `git pull --rebase` onu birlestirmeye calisip cakisiyordu:
          #     CONFLICT (content): Merge conflict in haber_botu/netaris.db
          #     fatal: You are not currently on a branch.
          # Git ikili dosyayi birlestiremez; boyle bir cakismanin dogru
          # cozumu de yok zaten.
          #
          # Onun yerine: uzak ucun uzerine kendi dosyalarimizi koyuyoruz.
          # `reset --soft` calisma dizinine DOKUNMAZ, yalnizca dalin
          # isaret ettigi yeri degistirir. Bu calistirmada uretilen veri
          # en gunceli oldugu icin dogru davranis bu.
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --soft "origin/${GITHUB_REF_NAME}"

          git add -A $YOLLAR
          if git diff --staged --quiet; then
            echo "degisiklik yok"
          else
            git commit -m "otomatik: veri güncellemesi $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
