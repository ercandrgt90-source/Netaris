# Bilanco hatti -- KENDI IS AKISI.
#
# NEDEN AYRI
# ----------
# 2026-08-20'de olculdu: bilanco adimlari ana otomasyona dahilken is
# 24dk 55sn'de 25 dakikalik tavana carpip KESILDI. Hicbir sey
# dagitilmadi, hicbir bilanco sayfasi yayimlanmadi.
#
# Sebep is yukunun BUYUKLUGU degil, iki hattin RITMININ farkli olmasi:
#
#   haber hatti    yarim saatte bir, birkac dakika surer
#   bilanco hatti  yilda dort kez, 972 istek + 60 model cagrisi
#
# Ikisini ayni tavana sikistirmak, sik kosan hatti nadir kosan yuzunden
# riske atiyordu. Ayirinca her biri kendi suresini aliyor ve bilanco
# kesilse bile haber akisi etkilenmiyor.
#
# TAKVIM
# ------
# Bildirim aylarinin (Mart, Mayis, Agustos, Kasim) her gunu, gunde iki
# kez. Diger aylarda kosu baslar ama `uret_bilanco` icindeki takvim
# kapisi hemen doner -- kapiyi burada tekrarlamiyorum, iki yerde iki
# takvim bir gun ayrisir.
name: Netaris bilanço

on:
  schedule:
    # GUNDE IKI KEZ -> GUNDE BIR KEZ.
    #
    # Olculdu (2026-08-23): haber akisi 22 Agustos 20:54 UTC'de durdu
    # ve o gun yalnizca 102 haber toplandi (onceki gunler 378-465).
    # Sebep kod degil KOTA: ozel depoda GitHub Actions ayda 2.000
    # dakika veriyor.
    #
    # Kaba hesap, ayin 23'unde:
    #     bilanco   23 gun x 2 kosu = 46 kosu  (tavan 90 dk)
    #     otomasyon ~298 kosu x ~3 dk        = ~894 dk
    # Bilanco hatti tek basina kotanin buyuk kismini yiyor ve
    # bitince BUTUN is akislari duruyor -- haber akisi dahil.
    #
    # Bilancolar haftalar icinde geliyor, gunde iki kez bakmak
    # gereksiz: ayni bildirim ikinci kosuda da ayni sonucu veriyor.
    # Gunde bir kez, sabah 06:00 UTC.
    # AYIN BELIRLI GUNLERINDE -- "her gun" DEGIL.
    #
    # Onceki deger `0 6 * 3,5,8,11 *` idi ve "uc ayda bir" sanildi.
    # Gercekte okunusu: dakika 0, saat 6, AYIN HER GUNU, aylar
    # 3/5/8/11. Yani bildirim aylarinda HER GUN kosuyordu.
    #
    # Olculdu (2026-08-27, Actions ekrani): 21-26 Agustos arasi her
    # gun bir kosu, her biri ~50 dakika. Ayda ~1550 dakika -- tek
    # basina 2000 dakikalik kotanin dortte ucu.
    #
    # Gun listesi acikca yaziliyor: hat kosu basina ~60 sayfa
    # uretiyor ve ~330 sirket icin alti kosu yetiyor. Haftanin gunu
    # `*` birakildi -- cron'da gun-of-month ve gun-of-week birlikte
    # verilince VEYA gibi davraniyor ve beklenmedik gunlerde kosuyor.
    # DEPO HERKESE ACIK -- 2026-08-27. Actions dakikasi SINIRSIZ.
    #
    # Gun listesi (1,5,9,13,17,21) kotayi korumak icin konmustu ve
    # yan etkisi vardi: 2026-08-27'de olculdu, 65 kumulatif sayfanin
    # ceyreklik karsiligi hala uretilmemisti ve takvime gore siradaki
    # kosu 1 KASIM'di. Yani bir bicim hatasi iki ay daha yasayacakti.
    #
    # Bildirim aylarinda HER GUN. KAP bildirimleri ayin tamamina
    # yayiliyor; alti sabit gune bakmak, aradaki bildirimleri bir
    # sonraki pencereye erteliyor.
    #
    # AYLAR GENISLETILDI: 2,3,4,5,7,8,10,11.
    #
    # Eski liste (3,5,8,11) ve yanindaki gerekce -- 'bildirim disi
    # aylarda yeni bilanco gelmiyor' -- YANLISTI. O aylar KONSOLIDE
    # bildirim son tarihleri. Konsolide OLMAYAN sirketler donem
    # bitiminden otuz gun sonra bildiriyor: 9 aylik tablolar EKIM
    # SONUNDA geliyor, pencere ise Kasim'da aciliyordu.
    #
    # Kullanici 13 Ekim 2026'da 'bilancolar gelmeye basladi' dedi ve
    # hat o gun kapaliydi -- is akisi hic baslamiyordu bile.
    #
    # Her donemin YAKLASMA ayi eklendi (2,4,7,10). O aylarda agir is
    # YAPILMIYOR: `uret_bilanco` kendi kapisindan donuyor. Yapilan
    # tek sey nobetcinin BAKMASI -- sirket basina tek istek.
    #
    # Bu, bu dosyanin kendi uyarisinin geregi: 'kapiyi burada
    # tekrarlamiyorum, iki yerde iki takvim bir gun ayrisir.' Cron
    # ikinci takvimdi ve gercekten ayristi; artik karar tek yerde
    # (`uret_bilanco.donem_acik`) ve OLCUME bagli.
    # DAKIKA 0 DEGIL 23 -- GITHUB'IN EN SIKISIK PENCERESI.
    #
    # GitHub zamanlanmis kosulari yuk altinda geciktiriyor ve saat
    # basi (dakika 0) en kalabalik pencere. Gunde bir kosan bir is
    # akisinda bu gecikme dogrudan goruniyor.
    #
    # OLCULDU (2026-10-14, Actions API): en son ZAMANLANMIS bilanco
    # kosusu 06:00 icin planlanmisti ve 13:13'te kostu -- YEDI SAAT
    # gecikme. Otomasyon akisinda fark edilmiyor cunku yarim saatte
    # bir kosuyor; gunde bir kosanda bir gun kaybi demek.
    #
    # Dakika 23 secildi: ne saat basi ne de yarim saat. Sikligi ve
    # ay listesini DEGISTIRMIYOR -- asagidaki butun gerekceler
    # oldugu gibi gecerli.
    - cron: "23 6 * 2,3,4,5,7,8,10,11 *"
  workflow_dispatch:
    inputs:
      yayinla:
        description: "Cloudflare'e dağıt"
        type: boolean
        default: true
      zorla:
        description: "Bildirim ayı olmasa da çalıştır"
        type: boolean
        default: false
      sinir:
        description: "Bu koşuda en fazla kaç sayfa"
        type: string
        default: "60"
      saglayici:
        # "VARSAYILAN" SECENEGI KALDIRILDI -- yanlis sey vaat ediyordu.
        #
        # Liste soyleydi: ["varsayilan", "cloudflare", "anthropic"] ve
        # varsayilan "varsayilan"di. Formu okuyan kisi bunu "sistemin
        # normal tercihi" diye anlar; kodun normal tercihi ise
        # `yorumcu.saglayici()`de yazili ve ANTHROPIC ONCELIKLI.
        #
        # Gercekte asagidaki ifade "varsayilan"i CLOUDFLARE'e
        # ceviriyordu. Yani secenek adi, yaptigi seyin tersini
        # soyluyordu. Ustelik bu blogun kendi aciklamasi da
        # "Normalde Anthropic varsa o kullaniliyor" diyordu -- kod
        # degismis, not eski davranisi anlatmaya devam etmisti.
        #
        # BEDELI OLCULDU (2026-08-28): kosu varsayilanla baslatildi,
        # 44 dakika calisti, 328 sirketten 41'ini yazdi. 287 atlamanin
        # 286'si "girdide olmayan sayi" -- yani ucuz model, verilmeyen
        # rakamlar uretti ve dogrulama zinciri hepsini reddetti.
        # Depodaki gecmis oranlar: anthropic %65, cloudflare %21.
        #
        # Liste artik yalnizca GERCEK saglayicilari iceriyor. Ucretsiz
        # olan hala varsayilan -- gunde iki kez kendi kendine kosan bir
        # isin sessizce faturaya yazmamasi bilincli bir karardi ve
        # duruyor. Degisen tek sey, secenegin ne yaptigini SOYLEMESI.
        description: "AI sağlayıcı — cloudflare ücretsiz (ölçüldü: %21 geçer), anthropic ücretli (%65)"
        type: choice
        options: ["cloudflare", "anthropic"]
        default: "cloudflare"

# KENDI GRUBU -- ana otomasyonla ORTAK DEGIL.
#
# Once ortakti ve yanlisti. `cancel-in-progress: false` yalnizca
# BASLAMIS kosuyu koruyor; KUYRUKTAKI kosu, ayni gruba yeni bir istek
# girince iptal ediliyor:
#
#   "Canceling since a higher priority waiting request for
#    netaris-depo-yazma exists"
#
# Ana otomasyon YARIM SAATTE BIR kosuyor. Bilanco kuyruga girdiginde
# bir sonraki haber kosusu onu superseded ediyor -- yani bilanco
# neredeyse hic sira bulamiyor. Ortak grup, es zamanli yazmayi
# engellemek icin konmustu ama BASLAMAYI da engelliyordu.
#
# Yazma yarisi artik DOGRU YERDE cozuluyor: geri yazma adimi yalnizca
# KENDI yollarini asamaya aliyor (`--ignore-removal`) ve push
# reddedilirse yeniden deneniyor. Iki kosu ayni anda yazsa bile
# birbirinin ciktisini ezmiyor.
concurrency:
  group: netaris-bilanco
  cancel-in-progress: false

jobs:
  bilanco:
    runs-on: ubuntu-latest
    # Ana isin tavani 25 dakika; burasi genis cunku 972 ag istegi ve
    # 60 model cagrisi var. Yine de SINIRSIZ degil: takilan bir kosu
    # saatlerce runner tutmamali.
    # 50 -> 330.
    #
    # 50 dakika KOTA gerekcesiyle secilmisti ("takilan tek kosu
    # kotanin %4,5'ini yakiyor"). Depo 2026-08-27'de herkese acik
    # yapildi; dakika sinirsiz, yani o gerekce artik yok.
    #
    # Daha onemlisi: 50 dakika ISE YETMIYORDU. Olculdu (kosu
    # 33068672121, herkese acik gunlukten):
    #
    #     Bilanco verisi        16.0 dk   her kosuda sabit maliyet
    #     Bilanco sayfalari     34.0 dk   IPTAL -- tavana carpti
    #     Siteyi kur / Dagit      atlandi
    #     Geri yaz             basarili   9 sayfa kurtarildi
    #
    # 34 dakikada 9 sayfa = sayfa basina ~3,8 dk. Varsayilan
    # `--sinir 60` icin 16 + 228 = ~244 dakika gerekiyor. Yani tavan
    # 50 iken kosu ASLA bitemezdi ve DAGITIM ADIMI HIC CALISMAZDI:
    # sayfalar uretiliyor, depoya yaziliyor, ama canliya cikmiyordu.
    # Hata sessizdi cunku geri yazma adimi `always()` ile kosup
    # basarili gorunuyordu.
    #
    # 330: 60 sayfalik kosuya (~244 dk) rahat pay birakiyor ve
    # GitHub'in 6 saatlik sert sinirinin altinda kaliyor. Tavan hala
    # "takilan kosu sonsuza kadar surmesin" icin var -- ama artik
    # normal kosuyu kesmiyor.
    timeout-minutes: 330

    permissions:
      contents: write

    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Node kur
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # NOBETCI CEKIMDEN ONCE: bayragi o kaldiriyor ve
      # `uret_bilanco.donem_acik` onu okuyor.
      # SEKTORU EKSIK SIRKETLERI DOLDUR -- hattin gorus alanini genislet.
      #
      # `uret_bilanco --hepsi` sektor listesini defterdeki `sektor_tr`
      # alanindan kuruyor; o alani olmayan sirket hicbir sektore
      # dusmuyor ve sayfasi HIC uretilmiyor.
      #
      # OLCULDU (2026-10-13): 794 sirketin 441'inde alan bos. Bu
      # 441'den rastgele 25 ornek kaynaga soruldu: 13'unun sektoru
      # VARDI (KONYA, OBAMS, LKMNH, GSRAY...). Yani kabaca 230 gercek
      # sirket yalnizca bir alan bos oldugu icin yayimlanmiyordu.
      #
      # Kucuk parti: kaynak 429 vermesin diye. Is RESUMABLE, kalan
      # bir sonraki kosuda; kosu basina ~25 ile bir bildirim
      # mevsiminde liste tamamen doluyor.
      - name: Eksik sektörleri doldur
        run: python haber_botu/sektor_tazele.py --sinir 25

      - name: Bilanço nöbetçisi (yeni çeyrek var mı)
        run: python haber_botu/bilanco_nobetci.py

      # SAYFALAR VERIDEN ONCE -- KAYNAGIN IZNI SINIRLI.
      #
      # OLCULDU (2026-10-14). Iki adim ayni kaynaga gidiyor ve kaynak
      # kosu basina ancak belirli sayida istege cevap veriyor; sonra
      # sekiz ardisik redle `bilanco_ag.KAPANDI` devreye giriyor.
      #
      # Veri adimi 324 sirketi x uc tablo denemek istiyor, yani izni
      # TEK BASINA tuketiyor. Sayfa adimi ardindan ac kaliyor:
      #
      #   12:19 kosusu  -> veri once -> 1 sayfa yazildi
      #   17:16 kosusu  -> veri once -> 0 sayfa yazildi
      #
      # Sonuc: 15 Eylul'den 14 Ekim'e kadar sayfa adimi TOPLAM iki
      # sayfa yazdi. Ozetteki 324 sirketten 109'unun HIC sayfasi yok
      # ve dort futbol kulubu de onlarin arasinda.
      #
      # Ayni kosu yerelde veri adimi OLMADAN denendi: İletişim'in
      # yedi sirketinin HEPSI sorunsuz cekildi (21 istek). Yani sorun
      # kaynagin tumden reddetmesi degil, SIRA.
      #
      # Sayfa adimi okurun gordugu seyi uretiyor; veri adimi
      # medyanlari TAZELIYOR ve bir kosu gecikmesi zarar vermiyor
      # (sayfa, sirketin kendi rakamlarini zaten taze cekiyor).
      # Oncelik okura verildi.
      - name: Bilanço sayfaları (tablo + AI yorumu)
        env:
          # AI yorumu. Tanimliysa Anthropic, degilse CLOUDFLARE_* ile
          # Workers AI. Ikisi de yoksa adim SIFIR sayfa yazip geciyor
          # -- yorumsuz sayfa yayimlanmiyor, bu bir kural.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ZAMANLANMIS KOSU UCRETSIZ SAGLAYICIYI KULLANIR.
          #
          # `inputs.saglayici` yalnizca ELLE calistirmada dolu;
          # zamanlanmis kosuda BOS geliyordu ve bos deger normal
          # siraya donuyor -- yani Anthropic'e, yani UCRETLI.
          #
          # Karar acikti: ucretsiz devam. Gunde iki kez kendi
          # kendine kosan bir isin sessizce faturaya yazmasi, o
          # karari gecersiz kilardi.
          #
          # Elle calistirmada `anthropic` secilebiliyor. Zamanlanmis
          # kosuda `inputs` bos gelir ve ucretsiz saglayiciya duser.
          #
          # IFADE SADELESTI: eskiden "varsayilan" secenegini de
          # cloudflare'e cevirmesi gerekiyordu. O secenek kaldirildi --
          # adi yaptiginin tersini soyluyordu ve bir kosuyu bosa
          # harcadi (bkz. `saglayici` girdisinin notu).
          NETARIS_AI_SAGLAYICI: ${{ inputs.saglayici || 'cloudflare' }}
        run: |
          python haber_botu/uret_bilanco_sayfa.py \
            --sinir ${{ inputs.sinir || '60' }}

      # ESKI KUMULATIF SAYFAYI CEYREKLIGI URETILDIGINDE KALDIR.
      #
      # KAP donemleri kumulatif: "2026/6" yilin ilk YARISI demek, ikinci
      # ceyrek degil. Sayfalar bir donem bu etiketle uretildi.
      #
      # TEMIZLIGI NEDEN CI YAPIYOR
      # Once elle calistirdim, 33 sayfa silindi ve bir sonraki otomasyon
      # kosusu HEPSINI GERI GETIRDI:
      #
      #     152cbfb  otomatik: veri guncellemesi 19:53  <- geri getirdi
      #     be55613  Ceyrekligi uretilen 33 ... kaldirildi
      #
      # Kosu benim silmemden ONCE checkout almisti ve geri yazma adimi
      # `git add --ignore-removal` kullaniyor -- o bayrak silmeleri hic
      # sahnelemiyor, dolayisiyla eski dosyalar diriliyor. Bayrak iki is
      # akisinin birbirinin sayfalarini silmesini engellemek icin var ve
      # KALMALI; cozum, temizligi kosunun ICINE almak.
      #
      # Boylece uretimle temizlik ayni islemde: sayfa ceyreklige
      # cevrildigi anda kumulatif karsiligi dusuyor.
      #
      # COZUM YARIM KALMISTI -- 2026-08-28'de olculdu.
      #
      # Temizligi kosunun icine almak, O KOSUNUN kurdugu siteyi
      # temizliyor ama DEPOYU temizlemiyor: silme hala sahnelenmedigi
      # icin dosya depoda kaliyor ve bir sonraki otomasyon kosusu onu
      # yeniden yayimliyor. Yani arac hicbir zaman kalici bir sey
      # yapmadi; ENDAE ve ENTRA'nin ikiser sayfasi bu yuzden canliydi.
      #
      # Iki eksik kapatiliyor:
      #   1. `if: always()` -- kosu uretim adiminda kesildiginde geri
      #      yazma calisiyordu ama temizlik ATLANIYORDU. Sonuc: yeni
      #      ceyreklik sayfa depoya giriyor, eski kumulatif kaliyor ve
      #      ayni sirketin ayni donemi icin IKI sayfa yayimlaniyor.
      #      Aynı dosyalara dokunan iki adim, ayni kosulu tasimali.
      #   2. `--liste` -- arac sildigi yollari bildiriyor; geri yazma
      #      adimi yalnizca O YOLLARI sahneliyor. Genis silme yetkisi
      #      verilmiyor, `--ignore-removal` yerinde kaliyor.
      #
      # `--uygula` burada BILEREK veriliyor. Yorum denetiminden farkli:
      # orada silinen sey MODEL CIKTISI ve yeniden uretmek para/kota
      # harciyor. Burada silinen sey, yerine YENISI URETILMIS olan eski
      # bir dosya -- ve arac karsiligi olmayani zaten silmiyor.
      - name: Bilanço verisi (sektör → mali tablo → medyan)
        run: |
          python haber_botu/uret_bilanco.py --hepsi \
            ${{ inputs.zorla && '--zorla' || '' }}

      # ESKI SAYFALARI ONAR -- KURALI SIKILASTIRMAK ESKIYI TEMIZLEMEZ.
      #
      # Sayfa bicimi ya da olcum kurali degistiginde ZATEN YAYINDA
      # olan sayfalar eski haliyle kaliyor. Olculdu (2026-10-13):
      # 258 bilanco sayfasinin 203'u seviye tablosu ile oran
      # tablosunda IKI AYRI DONEMI anlatiyordu (ara donemin kac
      # ceyrekten olustugu iki yerde ayri yaziliydi), 16'si da
      # alt sektorune uymayan bir okuma kilavuzu tasiyordu.
      #
      # Onarim MODEL CAGIRMIYOR: sakli AI yorumu aynen yeniden
      # kullaniliyor, yalnizca deterministik kisimlar kuruluyor.
      # Maliyet yalnizca kaynak istegi ve o ucretsiz.
      #
      # SIRA ONARIM IHTIYACINA GORE: alfabetik sira + `--sinir`
      # kuyrugun sonuna hic ulasmazdi (ayni tuzaga sektor sirasinda
      # dusulmustu). Kuyruk onarilan sayfa sayisinca kisaliyor ve
      # bitince adim kendiliginden etkisiz hale geliyor.
      #
      # `--sinir 25` kaynagi yormamak icin: sayfa basina uc tablo,
      # yani 75 istek. Kaynak ~100 istekten sonra reddetmeye
      # basliyor (olculdu 2026-09-14).
      - name: Eski bilanço sayfalarını onar (model çağrısı YOK)
        if: always()
        run: python haber_botu/bilanco_tazele.py --onarim --sinir 25

      # CIRCIR SIKISIYOR -- onarilan sayfa miras listesinden cikiyor.
      #
      # Liste budanmazsa onarilmis sayfalar listede kalir ve bir daha
      # HIC denetlenmez: 204 sayfa kalici olarak korumasiz kalirdi.
      # Budama korumayi yalnizca SIKILASTIRIYOR, gevsetmiyor -- bu
      # yuzden CI'in kendi korumasinin listesini guncellemesi guvenli.
      - name: Onarılanları miras listesinden çıkar
        if: always()
        run: python site/test_bilanco_sayfa_saglam.py --budar

      # BAYRAK SAYFALAR URETILDIKTEN SONRA INIYOR: arada kosu
      # duserse bir sonraki kosu ayni isi tekrar denemeli.
      - name: Bilanço dönemi işlendi (bayrağı indir)
        run: python haber_botu/bilanco_nobetci.py --kapat

      - name: Kümülatif bilanço sayfalarını topla
        if: always()
        run: >-
          python haber_botu/kumulatif_temizle.py --uygula
          --liste "${RUNNER_TEMP}/silinen-kumulatif.txt"

      - name: Siteyi kur ve denetle
        run: |
          python site/insa.py
          python haber_botu/denetim.py

      - name: Dağıt
        if: ${{ github.event_name == 'schedule' || inputs.yayinla }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: site
        run: npx wrangler deploy

      - name: Üretilen sayfaları geri yaz
        # `always()`: kosu kesilse bile O ANA KADAR yazilan sayfalar
        # kaybolmasin. Hat kendini adim adim dolduruyor; yarim kalan
        # bir kosu da ilerleme sayilir.
        if: always()
        run: |
          git config user.name  "netaris-bot"
          git config user.email "actions@users.noreply.github.com"

          YOLLAR=""
          # NOBET DEFTERI DE GERI YAZILIYOR.
          #
          # Nobetci her sirketin en son hangi ceyregi bildirdigini
          # bu dosyada tutuyor. Geri yazilmazsa her kosu SOGUK
          # baslar, hicbir gecisi goremez ve duzenek olu kalir.
          for y in site/bilanco_miras_bozuk.json \
                   site/icerik/analizler \
                   haber_botu/kaynak/sektor_ozet.json \
                   haber_botu/kaynak/sirketler.json \
                   haber_botu/kaynak/bilanco_nobet.json; do
            [ -e "$y" ] && YOLLAR="$YOLLAR $y"
          done
          [ -z "$YOLLAR" ] && { echo "yazilacak veri yok"; exit 0; }

          SILINEN="${RUNNER_TEMP}/silinen-kumulatif.txt"

          # ASAMALAMA TEK YERDE TANIMLI.
          #
          # Once iki kez yaziliydi: burada bir kez, push yeniden
          # deneme dongusunde bir kez daha. Ayni karari veren iki kod
          # yolu, birinin degisip digerinin degismemesi demek -- bu
          # depoda tam bu sinif hatadan defalarca dusuldu. Fonksiyon,
          # yeniden denemenin ilk denemeden AYRISAMAMASINI garanti
          # ediyor.
          asamala() {
            # BASKASININ BILEREK SILDIGINI DIRILTME.
            #
            # `--ignore-removal` baskasinin dosyasini SILMIYOR ama
            # tersini acik birakiyordu: baskasinin SILDIGINI geri
            # ekliyordu. Olculdu (2026-08-28): bilanco kosusu 14:44'te
            # iki kumulatif sayfayi sildi, otomasyon kosusu 14:45'te
            # ikisini de geri ekledi -- cunku 14:30'daki checkout'unda
            # duruyorlardi.
            #
            # Kural: checkout'tan BU YANA uzak ucta silinmis dosya
            # calisma agacindan da dusurulur. SART: yalnizca bu kosunun
            # DOKUNMADIGI dosyalar; yeniden uretilmis olan daha tazedir.
            for y in $(git diff --diff-filter=D --name-only \
                       "${GITHUB_SHA}" "origin/${GITHUB_REF_NAME}" \
                       -- $YOLLAR 2>/dev/null || true); do
              [ -e "$y" ] || continue
              if git diff --quiet "${GITHUB_SHA}" -- "$y" 2>/dev/null; then
                rm -f "$y"
                echo "uzak ucta silinmis, diriltilmedi: $y"
              fi
            done

            # Yeni ve degismis dosyalar: DAR yetki, silmeler haric.
            # ELLE YAZILAN SAYFALAR GERI YAZILMAZ.
            #
            # OLCULDU (2026-10-18): bot commiti a73dc292,
            # `site/icerik/sayfalar/gizlilik.md`den 21 SATIR SILDI --
            # uygulama ici hesap silmeyi anlatan bolumu. Kimse silmedi;
            # kosu kendi ESKI calisma agacini geri yazdi.
            #
            # Mekanizma: kosu checkout'u aldiktan SONRA o dosya depoda
            # degisti. `reset --mixed` indeksi uzak uca esitliyor ama
            # CALISMA AGACI eski kaldigi icin `git add` eski icerigi
            # asamaya aliyor ve degisikligi geri aliyor.
            #
            # `UST_SILINEN` dongusu bu sinifin SILME yonunu koruyordu;
            # DEGISTIRME yonu acikti.
            #
            # `site/icerik/sayfalar/` tamamen elle yazilan bes sayfa.
            # `insa.py` oraya yalnizca OKUYOR -- hicbir hat yazmiyor,
            # yani geri yazmanin faydasi yok, tek etkisi elle yapilan
            # duzenlemeyi yok etmek.
            git add --ignore-removal $YOLLAR ':!site/icerik/sayfalar'

            # Silmeler AYRICA ve yalnizca temizleyicinin BILDIRDIGI
            # yollar icin. `git add -A` gibi genis bir yetki degil:
            # burada silinen her yol, bu kosuda calisan aracin kendi
            # sildigi ve yerine yenisini uretmis oldugu bir dosya.
            #
            # `-s` kullaniliyor, `-f` degil: dosya VAR ama BOS ise
            # silinecek bir sey yok demektir ve dongu bos calisir.
            if [ -s "$SILINEN" ]; then
              while IFS= read -r yol; do
                [ -n "$yol" ] || continue
                git rm --cached --quiet --ignore-unmatch -- "$yol"
              done < "$SILINEN"
            fi
          }

          # `--mixed` (varsayilan), `--soft` DEGIL. `--soft` indekse
          # dokunmadigi icin commit, kosu SURERKEN gonderilen kaynak
          # dosyalari sessizce geri aliyordu. Ana is akisinda olculdu.
          git fetch origin "${GITHUB_REF_NAME}"
          git reset "origin/${GITHUB_REF_NAME}"

          # `-A` DEGIL `--ignore-removal` ve sebebi olculdu.
          #
          # `git add -A` SILMELERI de asamaya aliyor. Kosucunun
          # calisma dizini checkout anindaki agaci tutuyor; o sirada
          # DIGER is akisi yeni dosya uretip gonderdiyse, bu dosyalar
          # origin'de VAR ama burada YOK -- ve `-A` bunu "silinmis"
          # sayip isliyor.
          #
          # 2026-08-20'de tam bu oldu: bilanco hatti 20:11'de 60
          # bilanco sayfasi uretti, ana otomasyon 20:20'de HEPSINI
          # sildi. Iki kosu ES ZAMANLI DEGILDI -- es zamanlilik grubu
          # calisti; sorun ZAMANLAMA degil, `-A`nin anlami.
          #
          # `--ignore-removal` yalnizca yeni ve degismis dosyalari
          # asamaya aliyor. Bu hattin URETTIGI dosyalar yaziliyor,
          # baskasinin urettikleri KORUNUYOR.
          #
          # Genis otomatik silme yetkisi hala YOK. Tek istisna,
          # `asamala` icinde acikca listelenen kumulatif sayfalar:
          # onlari bu kosunun kendi araci sildi ve yerlerine yenisi
          # uretildi.
          asamala

          # KAPI: yontemden bagimsiz sonuc dogrulamasi.
          #
          # `bilanco_nobet.json` BU LISTEYE DE EKLENDI. Dosyayi yalnizca
          # `YOLLAR` listesine eklemek YETMEDI: 2026-10-13'te kosu tam
          # burada dustu -- 'beklenmeyen dosya asamada'. Yani ayni karari
          # veren IKI liste var ve biri guncellenince oteki kalıyor.
          # Kapi dogru calisti; eksik olan benim ikinci listeyi
          # gormemem di.
          # ELLE YAZILAN SAYFA ASAMADA MI -- AYRI KAPI.
          #
          # Yukaridaki pathspec zaten disliyor, ama bu kontrol
          # YONTEMDEN BAGIMSIZ olarak sonucu dogruluyor. Ayni ders bu
          # dosyada bir kez daha yazili: bir karari tek yerde almak,
          # o yer degisince korumayi da kaybetmek demek.
          ELLE=$(git diff --staged --name-only \
            | grep -E '^site/icerik/sayfalar/' || true)
          if [ -n "$ELLE" ]; then
            echo "HATA: elle yazilan sayfa asamada -- geri yazma DURDURULDU:"
            echo "$ELLE"
            exit 1
          fi

          KACAK=$(git diff --staged --name-only | grep -vE \
            '^(site/icerik/analizler/|site/bilanco_miras_bozuk\.json|haber_botu/kaynak/(sektor_ozet|sirketler|bilanco_nobet)\.json)' \
            || true)
          if [ -n "$KACAK" ]; then
            echo "HATA: beklenmeyen dosya aşamada -- geri yazma DURDURULDU:"
            echo "$KACAK"
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "yeni sayfa yok"
          else
            git commit -m "otomatik: bilanço sayfaları $(date -u +'%Y-%m-%d %H:%M UTC')"
            # PUSH YENIDEN DENENIYOR.
            #
            # Iki is akisi artik AYRI es zamanlilik gruplarinda ve ayni
            # anda kosabiliyorlar. Ikisi de depoya yaziyor; ikincisinin
            # push'u "non-fast-forward" ile reddedilir.
            #
            # Dogru davranis ZORLAMAK DEGIL yeniden denemek: uzak uc
            # yeniden alinir, kendi yollarimiz tekrar asamaya konur ve
            # commit yenilenir. Zorlamak, digerinin ciktisini silmek
            # olurdu -- bugun tam bunu yasadik (60 bilanco sayfasi).
            for deneme in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "gonderildi (deneme $deneme)"
                break
              fi
              echo "push reddedildi, uzak uc yeniden aliniyor ($deneme)"
              git fetch origin "${GITHUB_REF_NAME}"
              git reset "origin/${GITHUB_REF_NAME}"
              asamala
              git diff --staged --quiet && { echo "eklenecek yeni sey yok"; break; }
              git commit -m "otomatik: bilanço sayfaları $(date -u +'%Y-%m-%d %H:%M UTC')"
              sleep 3
            done
          fi
